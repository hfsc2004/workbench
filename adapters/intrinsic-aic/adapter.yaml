# intrinsic-aic adapter pack manifest
#
# Workbench reads this when a project declares `adapter: intrinsic-aic`.
# The adapter is a thin pack — five narrow responsibilities, no embedded
# build/log/storage subsystems. Workbench's verbs do the heavy lifting.

name: intrinsic-aic
version: 0.1.0
description: |
  Adapter for the Intrinsic AI for Industry Challenge (AIC).
  Wraps ROS 2 Kilted + Gazebo + AIC engine + Zenoh for local development
  and competition submission.

# Modes this adapter supports.
modes:
  play:
    script: play.sh
    needs:
      - PSF_AIC_WS
    description: |
      Sim + controllers + task board + cable on gripper. No engine, no
      scoring. Use this while writing and iterating on your policy.

  # eval and submit modes will land later — for now they're handled by
  # docker-compose path inherited from the AIC repo.
  eval:
    script: eval.sh
    needs:
      - PSF_AIC_WS
    description: |
      Official evaluator stack (ground_truth off). Use this for real
      qualification scoring checks.
  submit:
    script: submit.sh
    needs:
      - PSF_AIC_SUBMIT_TAG
      - PSF_AIC_SUBMIT_TEAM
    description: |
      Build and push immutable submission image to AIC ECR with strict
      preflight checks (auth, repository, tag collision).

# Configuration knobs an AIC project can set in workbench.project.yaml under
# `adapter_config:` — these become PSF_AIC_* env vars to the launcher.
config:
  aic_ws:
    description: Path to the cloned AIC pixi workspace
    required: true
    env: PSF_AIC_WS

  gui:
    description: Show Gazebo GUI window
    default: true
    env: PSF_AIC_GUI

  rviz:
    description: Show RViz window
    default: true
    env: PSF_AIC_RVIZ

  ground_truth:
    description: |
      Expose ground-truth TF data in Play mode. Useful for development
      and debugging — but the eval runs with this OFF, so policies that
      rely on it during play will fail under evaluation.
    default: true
    env: PSF_AIC_GROUND_TRUTH

  spawn_task_board:
    default: true
    env: PSF_AIC_SPAWN_TASK_BOARD

  spawn_cable:
    default: true
    env: PSF_AIC_SPAWN_CABLE

  attach_cable_to_gripper:
    default: true
    env: PSF_AIC_ATTACH_CABLE

  cable_type:
    description: Cable model used at spawn time
    default: sfp_sc_cable
    choices: [sfp_sc_cable, sfp_sc_cable_reversed]
    env: PSF_AIC_CABLE_TYPE

  submit_tag:
    description: Immutable ECR tag to push (e.g. v12)
    env: PSF_AIC_SUBMIT_TAG

  submit_team:
    description: AIC team slug provisioned by Intrinsic
    env: PSF_AIC_SUBMIT_TEAM

  submission_dir:
    description: Project root containing docker/Dockerfile for submission
    env: PSF_AIC_SUBMISSION_DIR

  submit_region:
    description: AWS region for ECR
    default: us-east-1
    env: PSF_AIC_SUBMIT_REGION

  eval_visual:
    description: |
      When true, Eval launches Gazebo/RViz for human debugging. Keep false
      for strict headless parity with official scoring behavior.
    default: false
    env: PSF_AIC_EVAL_VISUAL

  vision_model_enable:
    description: Enable model-based visual offset inference in policy runtime
    default: false
    env: PSF_AIC_VISION_MODEL_ENABLE

  vision_model_path:
    description: Path inside model container to the vision model file
    default: /ws_aic/src/aic_policy/data/models/vision_offset_model.npz
    env: PSF_AIC_VISION_MODEL_PATH

  vision_capture_dir:
    description: Path inside model container to save captured vision samples
    default: /ws_aic/src/aic_policy_capture
    env: PSF_AIC_VISION_CAPTURE_DIR

# Diagnostic rules contributed to Workbench's Log Intelligence (later).
# Empty for now; will populate as we capture lessons during development.
diagnostics:
  rules: []
