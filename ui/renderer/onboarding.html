<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PSF Workbench — New Project</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .brand-bar {
      position: fixed;
      top: 18px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--fg-mute);
      font-size: 13px;
      z-index: 5;
    }
    .brand-bar .mini-logo {
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 1px var(--card-edge);
    }
    .brand-bar .mini-logo img { width: 80%; height: 80%; object-fit: contain; }
    .brand-bar b { color: var(--fg-dim); font-weight: 600; }

    .steps {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0;
      font-size: 12px;
      color: var(--fg-mute);
      z-index: 5;
    }
    .steps .step {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
    }
    .steps .step .num {
      width: 22px; height: 22px;
      border-radius: 50%;
      border: 1px solid var(--card-edge);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--fg-mute);
    }
    .steps .step.active .num {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(111, 202, 177, 0.12);
    }
    .steps .step.done .num {
      border-color: var(--accent);
      color: var(--bg);
      background: var(--accent);
    }
    .steps .step.active .label,
    .steps .step.done .label { color: var(--fg-dim); }
    .steps .sep { width: 30px; height: 1px; background: var(--card-edge); }

    .stage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 96px 24px 60px;
    }

    /* drive picker */
    .drive-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .drive-pick {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid var(--card-edge);
      border-radius: 8px;
      background: rgba(255,255,255,0.015);
      font-family: var(--mono);
      font-size: 13px;
      color: var(--fg-dim);
      cursor: pointer;
    }
    .drive-pick.selected {
      border-color: var(--accent);
      background: rgba(111, 202, 177, 0.06);
      color: var(--fg);
    }
    .drive-pick .meta {
      color: var(--fg-mute);
      font-size: 11px;
      margin-top: 4px;
    }

    /* install plan */
    .plan {
      margin: 12px 0 24px;
      border: 1px solid var(--card-edge);
      border-radius: 8px;
      overflow: hidden;
    }
    .plan-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-edge);
      font-family: var(--mono);
      font-size: 13px;
    }
    .plan-row:last-child { border-bottom: none; }
    .plan-row .stat {
      width: 18px;
      flex-shrink: 0;
      text-align: center;
    }
    .plan-row .stat.ok { color: var(--good); }
    .plan-row .stat.todo { color: var(--fg-mute); }
    .plan-row .stat.busy { color: var(--accent); }
    .plan-row .name { flex: 1; color: var(--fg); }
    .plan-row .name .sub {
      color: var(--fg-mute);
      font-size: 11px;
      font-family: var(--sans);
      display: block;
      margin-top: 2px;
    }
    .plan-row .size {
      color: var(--fg-mute);
      font-size: 11px;
      flex-shrink: 0;
    }
    .plan-totals {
      display: flex;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(255,255,255,0.025);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--fg-dim);
      border-top: 1px solid var(--card-edge);
    }

    /* progress rows */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-edge);
      font-size: 13px;
    }
    .progress-row:last-child { border-bottom: none; }
    .progress-row .stat {
      width: 22px;
      flex-shrink: 0;
      text-align: center;
      font-family: var(--mono);
    }
    .progress-row .stat.ok { color: var(--good); }
    .progress-row .stat.todo { color: var(--fg-mute); }
    .progress-row .stat.busy { color: var(--accent); }
    .progress-row .name { flex: 1; color: var(--fg); }
    .progress-row.todo .name { color: var(--fg-mute); }
    .progress-row .detail {
      color: var(--fg-mute);
      font-family: var(--mono);
      font-size: 11px;
      flex-shrink: 0;
    }
    .progress-row .bar-wrap {
      width: 180px;
      height: 4px;
      background: rgba(111, 202, 177, 0.08);
      border-radius: 2px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .progress-row .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, rgba(111, 202, 177, 0.55), var(--accent));
      width: 0%;
      transition: width 0.4s linear;
    }
    .progress-summary {
      padding: 14px 16px;
      background: rgba(255,255,255,0.025);
      font-size: 12px;
      color: var(--fg-dim);
      border-top: 1px solid var(--card-edge);
      display: flex;
      justify-content: space-between;
    }
    .progress-summary .interpreter::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 6px;
      vertical-align: 1px;
      animation: breath 2.4s ease-in-out infinite;
    }
    @keyframes breath {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(111, 202, 177, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ready screen */
    .ready-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(111, 202, 177, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 18px;
    }
    .ready-list {
      list-style: none;
      padding: 0;
      margin: 18px 0 24px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--fg-dim);
    }
    .ready-list li {
      padding: 6px 0;
      display: flex;
      gap: 12px;
    }
    .ready-list .lab { color: var(--fg-mute); flex-shrink: 0; min-width: 110px; }
    .ready-list .val { color: var(--fg); }
    .ready-list .val.good { color: var(--good); }
  </style>
</head>
<body>

  <div class="brand-bar">
    <div class="mini-logo"><img src="../assets/logo.png" alt="" /></div>
    <span><b>PSF Workbench</b></span>
  </div>

  <div class="steps" id="steps">
    <div class="step active" data-step="0"><span class="num">1</span><span class="label">Storage</span></div>
    <span class="sep"></span>
    <div class="step" data-step="1"><span class="num">2</span><span class="label">Project</span></div>
    <span class="sep"></span>
    <div class="step" data-step="2"><span class="num">3</span><span class="label">Competition</span></div>
    <span class="sep"></span>
    <div class="step" data-step="3"><span class="num">4</span><span class="label">Install</span></div>
    <span class="sep"></span>
    <div class="step" data-step="4"><span class="num">5</span><span class="label">Ready</span></div>
  </div>

  <div class="stage">
    <article class="card" id="card"></article>
  </div>

  <script>
    'use strict';

    /*
      The onboarding wizard is, for now, a designed-but-not-wired-up flow
      adapted from mock3.html. The real implementation (storage migration,
      Docker pulls, image builds, smoke test) is post-AIC work.

      Right now this exists so a user can click through the design and we
      can iterate on the UX while the underlying machinery is built.

      Step 5 (Ready) ends with a button that returns to the chooser.
    */

    const state = {
      step: 0,
      drive: 'big',
      intent: 'compete',
      competition: 'aic',
      installRunning: false,
      installPhase: 0,
      installDownloadProgress: 0,
    };

    const card = document.getElementById('card');

    function render() {
      document.querySelectorAll('.steps .step').forEach((el, i) => {
        el.classList.remove('active', 'done');
        if (i < state.step) el.classList.add('done');
        if (i === state.step) el.classList.add('active');
      });

      switch (state.step) {
        case 0: return renderStorage();
        case 1: return renderProject();
        case 2: return renderCompetition();
        case 3: return renderInstallPlan();
        case 4: return renderProgress();
        case 5: return renderReady();
      }
    }

    function renderStorage() {
      card.innerHTML = `
        <div class="eyebrow">Welcome</div>
        <h1 class="title">Where should robotics data live?</h1>
        <p class="lede">
          Workbench will manage Docker, simulators, and project data on your
          behalf. Pick a drive with at least <b>50 GB free</b>. Workbench will
          keep heavy artifacts here so your system disk stays clean.
        </p>

        <div class="drive-row">
          <div class="drive-pick ${state.drive === 'big' ? 'selected' : ''}" data-pick="big">
            /media/user/Third_4TB
            <div class="meta">2.0 TB free · ext4 · recommended</div>
          </div>
          <div class="drive-pick ${state.drive === 'home' ? 'selected' : ''}" data-pick="home">
            /home/user
            <div class="meta">24 GB free · ext4 · ⚠ system drive</div>
          </div>
        </div>

        <p class="hint">
          Storage migration is never silent. Workbench performs a dry run
          first, shows you what will move, stops affected services, preserves
          rollback instructions, and verifies the new layout before deleting
          old data.
        </p>

        <div class="actions">
          <a class="back" id="back-to-chooser">Back to projects</a>
          <span class="spacer"></span>
          <button class="btn-primary" id="next">Continue</button>
        </div>
      `;
      card.querySelectorAll('.drive-pick').forEach(el => {
        el.onclick = () => { state.drive = el.dataset.pick; render(); };
      });
      document.getElementById('next').onclick = () => { state.step = 1; render(); };
      document.getElementById('back-to-chooser').onclick = () => {
        window.workbench.navigate('chooser.html');
      };
    }

    function renderProject() {
      const opts = [
        { id: 'compete', t: 'Enter a robotics competition', s: 'AIC, RoboCup, ICRA, and others.' },
        { id: 'develop', t: 'Develop on a robot I have',     s: 'UR, Franka, KUKA, mobile platforms. Real or simulated.' },
        { id: 'demo',    t: 'Run an industrial demo',        s: 'Pre-built workflows for vision, sorting, inspection.' },
        { id: 'empty',   t: 'Empty project (advanced)',      s: 'Start from scratch. Pick adapters yourself.' },
      ];
      card.innerHTML = `
        <div class="eyebrow">Step 2 of 5</div>
        <h1 class="title">What do you want to do?</h1>
        <p class="lede">Pick the closest match. Workbench will set up the right adapters and templates for you. You can change later.</p>
        <div class="options">
          ${opts.map(o => `
            <div class="option ${state.intent === o.id ? 'selected' : ''}" data-id="${o.id}">
              <span class="radio"></span>
              <div class="body">
                <div class="opt-title">${o.t}</div>
                <div class="opt-sub">${o.s}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="actions">
          <a class="back">Back</a>
          <span class="spacer"></span>
          <button class="btn-primary" id="next">Continue</button>
        </div>
      `;
      card.querySelectorAll('.option').forEach(el => {
        el.onclick = () => { state.intent = el.dataset.id; render(); };
      });
      card.querySelector('.back').onclick = () => { state.step = 0; render(); };
      document.getElementById('next').onclick = () => { state.step = 2; render(); };
    }

    function renderCompetition() {
      const opts = [
        { id: 'aic',     t: 'Intrinsic AI for Industry Challenge',
                         s: 'Cable insertion · ROS 2 Kilted + Gazebo · qualification phase open until May 15, 2026.' },
        { id: 'robocup', t: 'RoboCup Logistics',
                         s: 'Multi-robot warehouse scenario · simulation-based qualifier.' },
        { id: 'icra',    t: 'ICRA Challenges',
                         s: 'Various robotics challenges hosted at ICRA conferences.' },
        { id: 'custom',  t: 'Custom competition',
                         s: 'Bring your own URL or repo. Workbench will detect what it needs.' },
      ];
      card.innerHTML = `
        <div class="eyebrow">Step 3 of 5</div>
        <h1 class="title">Which competition?</h1>
        <p class="lede">Workbench keeps tested adapter packs for known competitions. Pick yours and we'll fetch a known-good setup.</p>
        <div class="options">
          ${opts.map(o => `
            <div class="option ${state.competition === o.id ? 'selected' : ''}" data-id="${o.id}">
              <span class="radio"></span>
              <div class="body">
                <div class="opt-title">${o.t}</div>
                <div class="opt-sub">${o.s}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="actions">
          <a class="back">Back</a>
          <span class="spacer"></span>
          <button class="btn-primary" id="next">Continue</button>
        </div>
      `;
      card.querySelectorAll('.option').forEach(el => {
        el.onclick = () => { state.competition = el.dataset.id; render(); };
      });
      card.querySelector('.back').onclick = () => { state.step = 1; render(); };
      document.getElementById('next').onclick = () => { state.step = 3; render(); };
    }

    function renderInstallPlan() {
      const items = [
        { name: 'Docker engine',
          sub: 'reachable on host · GPU runtime configured',
          stat: 'ok', size: 'already installed' },
        { name: 'NVIDIA Container Toolkit',
          sub: 'enables GPU access for simulators',
          stat: 'todo', size: '~300 MB' },
        { name: 'AIC eval image',
          sub: 'ghcr.io/intrinsic-dev/aic/aic_eval:latest',
          stat: 'todo', size: '~9.0 GB' },
        { name: 'ROS 2 Kilted base + AIC SDK',
          sub: 'pixi-managed environment with policy build tools',
          stat: 'todo', size: '~4.0 GB' },
        { name: 'Workbench AIC adapter',
          sub: 'observation/action mappers, lifecycle, diagnostic rules',
          stat: 'todo', size: '~50 MB' },
        { name: 'Reference policy template',
          sub: 'starting point — you can edit or replace it later',
          stat: 'todo', size: '< 1 MB' },
      ];
      card.innerHTML = `
        <div class="eyebrow">Step 4 of 5</div>
        <h1 class="title">Setting up your AIC project</h1>
        <p class="lede">
          Here's what Workbench will install. Everything lands on
          <code style="font-family:var(--mono); color:var(--fg-dim);">/media/user/Third_4TB</code>.
        </p>

        <div class="plan">
          ${items.map(it => `
            <div class="plan-row">
              <span class="stat ${it.stat}">${it.stat === 'ok' ? '✓' : '○'}</span>
              <span class="name">${it.name}<span class="sub">${it.sub}</span></span>
              <span class="size">${it.size}</span>
            </div>
          `).join('')}
          <div class="plan-totals">
            <span>Total new download: ~13.4 GB</span>
            <span>Estimated time: 8–15 min on a typical connection</span>
          </div>
        </div>

        <div class="actions">
          <a class="back">Back</a>
          <span class="spacer"></span>
          <button class="btn-primary" id="install">Install everything</button>
        </div>
      `;
      card.querySelector('.back').onclick = () => { state.step = 2; render(); };
      document.getElementById('install').onclick = () => {
        state.step = 4;
        state.installRunning = true;
        state.installPhase = 0;
        state.installDownloadProgress = 0;
        render();
        runInstall();
      };
    }

    function renderProgress() {
      const phases = [
        { name: 'Verifying Docker',
          detail: 'host runtime + GPU access' },
        { name: 'Migrating Docker storage to /media/user/Third_4TB/docker',
          detail: 'dry run · move · verify · rollback retained' },
        { name: 'Installing NVIDIA Container Toolkit',
          detail: '~300 MB' },
        { name: 'Pulling AIC eval image',
          detail: 'ghcr.io/intrinsic-dev/aic/aic_eval:latest · ~9.0 GB',
          hasBar: true },
        { name: 'Installing ROS 2 Kilted base + AIC SDK',
          detail: 'pixi managed environment · ~4.0 GB' },
        { name: 'Building Workbench AIC adapter',
          detail: 'observation/action mappers · diagnostic rule pack' },
        { name: 'Generating project files',
          detail: 'Dockerfile · compose · launch · policy template' },
        { name: 'Smoke test',
          detail: 'reference policy · 3 trials · headless · result captured' },
      ];

      const rows = phases.map((p, i) => {
        let stat = 'todo';
        let detail = p.detail;
        let barFill = 0;
        if (i < state.installPhase) {
          stat = 'ok';
          detail = '✓ done';
        } else if (i === state.installPhase && state.installRunning) {
          stat = 'busy';
          if (p.hasBar) {
            barFill = state.installDownloadProgress * 100;
            const mb = (state.installDownloadProgress * 9.0).toFixed(1);
            detail = `${mb} / 9.0 GB`;
          }
        }
        return `
          <div class="progress-row ${stat === 'todo' ? 'todo' : ''}">
            <span class="stat ${stat}">
              ${stat === 'ok' ? '✓' : stat === 'busy' ? '<span class="spinner"></span>' : '○'}
            </span>
            <span class="name">${p.name}</span>
            ${p.hasBar && stat === 'busy'
              ? `<div class="bar-wrap"><div class="bar-fill" style="width:${barFill}%"></div></div>`
              : ''}
            <span class="detail">${detail}</span>
          </div>
        `;
      }).join('');

      card.innerHTML = `
        <div class="eyebrow">Step 5 of 5 · setting up</div>
        <h1 class="title">Installing your AIC project</h1>
        <p class="lede">
          Grab a coffee. Workbench is doing the work that would normally
          take hours of terminal time.
        </p>

        <div class="plan">
          ${rows}
          <div class="progress-summary">
            <span class="interpreter">Workbench is interpreting the live install logs</span>
            <span id="elapsedLabel">elapsed 0s</span>
          </div>
        </div>

        <div class="actions">
          <a class="back" id="cancel">Cancel</a>
          <span class="spacer"></span>
          <button class="btn-primary" disabled>Open project</button>
        </div>
      `;
      document.getElementById('cancel').onclick = () => {
        state.installRunning = false;
        state.step = 3;
        render();
      };
    }

    function renderReady() {
      card.innerHTML = `
        <div class="ready-icon">✓</div>
        <div class="eyebrow">Done</div>
        <h1 class="title">Your AIC project is ready.</h1>
        <p class="lede">
          Reference policy passed the smoke test. Everything is fingerprinted.
          You can run a real eval, edit your policy, or push your first
          submission whenever you want.
        </p>

        <ul class="ready-list">
          <li><span class="lab">Project</span><span class="val">aic-cable</span></li>
          <li><span class="lab">Location</span><span class="val">/media/user/Third_4TB/Workbench/aic-cable</span></li>
          <li><span class="lab">Adapter</span><span class="val">intrinsic-aic@0.1.0</span></li>
          <li><span class="lab">Smoke test</span><span class="val good">passed · 3.0 baseline</span></li>
          <li><span class="lab">Storage</span><span class="val good">managed</span></li>
          <li><span class="lab">Fingerprint</span><span class="val">sha256:b6c1…3d2f</span></li>
        </ul>

        <div class="actions">
          <button class="btn-secondary" id="back-to-chooser">Back to projects</button>
          <span class="spacer"></span>
          <button class="btn-primary" id="open-project">Open project</button>
        </div>
      `;
      document.getElementById('back-to-chooser').onclick = () => {
        window.workbench.navigate('chooser.html');
      };
      document.getElementById('open-project').onclick = () => {
        // Operator view doesn't exist yet — for now go back to chooser.
        window.workbench.navigate('chooser.html');
      };
    }

    // simulated install timing (matches mock3 — same data, real Electron now)
    function runInstall() {
      const durations = [400, 1200, 700, 0, 1500, 800, 500, 1000];
      const totalPhases = durations.length;
      state.installPhase = 0;
      const startedAt = Date.now();

      const labelElapsed = () => {
        const sec = Math.floor((Date.now() - startedAt) / 1000);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        const lab = document.getElementById('elapsedLabel');
        if (lab) lab.textContent = 'elapsed ' + (m ? m + 'm ' : '') + s + 's';
      };
      const elapsedTimer = setInterval(labelElapsed, 250);

      function nextPhase() {
        if (!state.installRunning) {
          clearInterval(elapsedTimer);
          return;
        }
        if (state.installPhase >= totalPhases) {
          clearInterval(elapsedTimer);
          state.installRunning = false;
          state.step = 5;
          render();
          return;
        }
        const phaseIdx = state.installPhase;
        render();
        if (phaseIdx === 3) {
          state.installDownloadProgress = 0;
          const tickEvery = 60;
          const totalMs = 4500;
          const stepPer = tickEvery / totalMs;
          const dl = setInterval(() => {
            if (!state.installRunning) {
              clearInterval(dl);
              clearInterval(elapsedTimer);
              return;
            }
            state.installDownloadProgress = Math.min(1, state.installDownloadProgress + stepPer);
            render();
            if (state.installDownloadProgress >= 1) {
              clearInterval(dl);
              state.installPhase += 1;
              setTimeout(nextPhase, 200);
            }
          }, tickEvery);
        } else {
          setTimeout(() => {
            state.installPhase += 1;
            nextPhase();
          }, durations[phaseIdx]);
        }
      }
      nextPhase();
    }

    render();
  </script>

</body>
</html>
