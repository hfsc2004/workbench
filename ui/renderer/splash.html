<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PSF Workbench</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      overflow: hidden;
    }
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      opacity: 0;
      animation: fadeIn 600ms ease forwards 60ms;
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Logo plate — soft white card holds the artwork without forcing the
       whole window to a white background. The logo itself is a colored
       PNG on a white background, which would clash with the dark UI if
       used full-bleed. */
    .logo-plate {
      width: 220px;
      height: 220px;
      background: #ffffff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.03) inset,
        0 24px 60px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(111, 202, 177, 0.08);
      animation: lift 1100ms cubic-bezier(0.22, 1, 0.36, 1) both 80ms;
    }
    @keyframes lift {
      from { transform: translateY(8px) scale(0.985); opacity: 0; }
      to   { transform: translateY(0)   scale(1);     opacity: 1; }
    }
    .logo-plate img {
      width: 84%;
      height: 84%;
      object-fit: contain;
    }

    .wordmark {
      font-size: 13px;
      letter-spacing: 6px;
      color: var(--fg-mute);
      text-transform: uppercase;
      animation: rise 900ms ease both 280ms;
    }
    @keyframes rise {
      from { transform: translateY(6px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    .tagline {
      font-size: 14px;
      color: var(--fg-dim);
      max-width: 480px;
      text-align: center;
      animation: rise 900ms ease both 380ms;
    }

    .progress {
      width: 180px;
      height: 2px;
      background: rgba(111, 202, 177, 0.10);
      border-radius: 1px;
      overflow: hidden;
      animation: rise 900ms ease both 480ms;
    }
    .progress .fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      animation: load 1400ms cubic-bezier(0.22, 1, 0.36, 1) forwards 600ms;
    }
    @keyframes load {
      0%   { width: 0%; }
      60%  { width: 70%; }
      100% { width: 100%; }
    }

    .skip {
      position: fixed;
      bottom: 18px;
      right: 22px;
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--fg-mute);
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 14px;
      border: 1px solid transparent;
      opacity: 0;
      animation: fadeIn 400ms ease forwards 1500ms;
    }
    .skip:hover {
      color: var(--fg-dim);
      border-color: var(--card-edge);
    }

    .credit {
      position: fixed;
      bottom: 18px;
      left: 22px;
      font-size: 11px;
      letter-spacing: 0.3px;
      color: var(--fg-mute);
      line-height: 1.7;
      opacity: 0;
      animation: fadeIn 400ms ease forwards 1500ms;
      pointer-events: none;
      user-select: none;
    }
    .credit .ver { display: block; opacity: 0.85; }
  </style>
</head>
<body>

  <div class="splash">
    <div class="logo-plate">
      <img src="../assets/logo.png" alt="PSF Workbench" />
    </div>
    <div class="wordmark">PSF · Workbench</div>
    <div class="tagline">
      Robotics tooling, deployable.
    </div>
    <div class="progress"><div class="fill"></div></div>
  </div>

  <a class="skip" id="skip">skip</a>

  <div class="credit">
    <span class="ver">v0.2.0</span>
    Copyright 2026 Pseudo Science Fiction
  </div>

  <script>
    'use strict';

    const SPLASH_HOLD_MS = 2200;          // total time on splash before auto-advance

    function go() {
      window.workbench.navigate('chooser.html');
    }

    // auto-advance once the splash has had time to play
    const t = setTimeout(go, SPLASH_HOLD_MS);

    // skip on click anywhere or via the "skip" affordance
    document.getElementById('skip').addEventListener('click', () => {
      clearTimeout(t);
      go();
    });
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('.skip')) return;       // already handled
      clearTimeout(t);
      go();
    });
  </script>

</body>
</html>
